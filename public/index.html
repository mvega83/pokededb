
<!doctype html>
<html lang="es">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width,initial-scale=1" />
		<title>Pokedex - Curso Nest</title>
		<style src="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css"></style>
			
		
	</head>
	<body>
		<header>
			<div class="logo">PK</div>
			<div>
				<h1 style="margin:0">Pokedex - Curso Nest</h1>
				<p style="margin:0;color:#6b7280">Lista de pokémones (ejemplo estático)</p>
			</div>
		</header>

		<main>
			<section class="grid" id="pokedex">
				<article class="card">
					<img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/1.png" alt="Bulbasaur">
					<h3 style="margin:0.5rem 0 0">#1 Bulbasaur</h3>
					<p style="margin:0;color:#6b7280">Tipo: Grass / Poison</p>
				</article>
				<article class="card">
					<img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/4.png" alt="Charmander">
					<h3 style="margin:0.5rem 0 0">#4 Charmander</h3>
					<p style="margin:0;color:#6b7280">Tipo: Fire</p>
				</article>
				<article class="card">
					<img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/7.png" alt="Squirtle">
					<h3 style="margin:0.5rem 0 0">#7 Squirtle</h3>
					<p style="margin:0;color:#6b7280">Tipo: Water</p>
				</article>
			</section>
		</main>

		<footer>
			<p>Proyecto de ejemplo para el curso. Puedes integrar con una API en Nest para listar pokémones dinámicamente.</p>
		</footer>
	</body>
</html>
